<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>Lead Growth System prototype — Pushkar Design Solution</title>
<style>
/* ============ Tokens (same system as the pitch deck) ============ */
:root{
  color-scheme:light;
  --surface:#FFFFFF; --sunken:#F5F7FA; --line:#E4E7EC; --line-2:#D0D5DD;
  --ink:#0F172A; --ink-2:#475467; --ink-3:#667085;
  --blue:#2453FF; --blue-ink:#1A3FD6; --blue-50:#EEF2FF;
  --green:#059669; --green-ink:#047857; --green-50:#ECFDF3;
  --amber:#F79009; --violet:#7A5AF8;
  --wa:#00A884; --wa-dark:#008069; --wa-bg:#EFEAE2; --wa-out:#D9FDD3; --wa-meta:#667781;
  --font:"Inter","SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --k:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,#FFFFFF 0%,#EEF1F5 100%) fixed;min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ============ Page chrome ============ */
.top{max-width:1320px;margin:0 auto;padding:20px 32px 8px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.01em;margin-right:auto}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.brand small{font-weight:500;color:var(--ink-3);font-size:15px;margin-left:4px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{height:38px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

.app{max-width:1320px;margin:0 auto;padding:16px 32px 40px;display:grid;gap:40px;
  grid-template-columns:280px auto minmax(300px,360px);grid-template-areas:"rail phone panel";justify-content:center;align-items:start}

/* step rail */
.rail{grid-area:rail;padding-top:8px}
.rail h2{font-size:14px;font-weight:600;color:var(--ink-3);margin:18px 0 8px 4px;display:flex;align-items:center;gap:8px}
.rail h2:first-child{margin-top:0}
.rail h2 svg.i{width:16px;height:16px}
.rail ol{list-style:none;display:grid;gap:2px}
.rail li button{width:100%;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;padding:7px 10px 7px 6px;border-radius:12px;font-size:15px;color:var(--ink-2);line-height:1.3}
.rail li button:hover{background:rgba(255,255,255,.7)}
.rail .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--ink-3);font-variant-numeric:tabular-nums}
.rail .n svg.i{width:14px;height:14px;stroke-width:2.6}
.rail .done .n{background:var(--green);border-color:var(--green);color:#fff}
.rail .now{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.06);border:1px solid var(--line)}
.rail .now .n{background:var(--blue);border-color:var(--blue);color:#fff}

/* phone */
.phone-wrap{grid-area:phone;width:calc(399px*var(--k));height:calc(836px*var(--k));position:relative}
.phone{width:399px;height:836px;border-radius:58px;background:#1D2433;padding:12px;position:absolute;left:0;top:0;transform:scale(var(--k));transform-origin:0 0;
  box-shadow:0 40px 80px -24px rgba(15,23,42,.35),0 12px 24px -8px rgba(15,23,42,.18)}
.phone::after{content:"";position:absolute;inset:3px;border-radius:55px;border:1px solid #3A4458;pointer-events:none}
.screen{width:375px;height:812px;border-radius:46px;overflow:hidden;position:relative;background:#fff;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:30;pointer-events:none}

/* explainer panel */
.panel{grid-area:panel;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 28px 24px;position:sticky;top:20px}
.who{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:600;background:var(--blue-50);color:var(--blue-ink)}
.who.owner{background:var(--green-50);color:var(--green-ink)}
.who svg.i{width:16px;height:16px}
.when{margin-top:18px;font-size:15px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.panel h1{margin-top:4px;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.025em}
.panel .desc{margin-top:12px;font-size:17px;line-height:1.55;color:var(--ink-2)}
.bts{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.bts h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.bts h3 svg.i{width:18px;height:18px;color:var(--blue)}
.bts ul{list-style:none;display:grid;gap:10px}
.bts li{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:15px;line-height:1.45;color:var(--ink-2)}
.bts li i{width:20px;height:20px;border-radius:50%;background:var(--green-50);color:var(--green);display:grid;place-items:center;margin-top:1px}
.bts li i svg.i{width:12px;height:12px;stroke-width:3}
.pnav{margin-top:28px;display:flex;gap:10px;align-items:center}
.btn{height:48px;padding:0 20px;border-radius:14px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg.i{width:18px;height:18px}
.btn-pri{background:var(--blue);color:#fff;flex:1}
.btn-pri:hover{background:var(--blue-ink)}
.btn-sec{border:1px solid var(--line-2);background:#fff}
.btn:disabled{opacity:.4;cursor:default}
.tip{margin-top:14px;font-size:14px;color:var(--ink-3);line-height:1.45}
.mnav{display:none}

/* hint ring on the next tap target */
.hint{animation:ring 1.8s ease-out infinite;position:relative;z-index:2}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(36,83,255,.55)}80%,100%{box-shadow:0 0 0 14px rgba(36,83,255,0)}}
.ig-cta.hint,.lp-btn.hint,.sheet-btn.hint{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:none}50%{filter:brightness(1.3) saturate(1.1)}}

/* screen transitions */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;overflow:hidden;color:#111B21}
.scr.fwd{animation:fwd .26s ease both}.scr.back{animation:bk .26s ease both}
@keyframes fwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes bk{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.scr::after{content:"";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(0,0,0,.85);z-index:25;pointer-events:none}
.scr.dark::after{background:rgba(255,255,255,.9)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.scr.still .sheet,.scr.still .nb.drop{animation:none}
.tapall{cursor:pointer}

/* ============ Inside the phone ============ */
.sb{height:50px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:12px 30px 0 40px;font-size:16px;font-weight:600;letter-spacing:-.01em;position:relative;z-index:3}
.sb .ic{display:flex;gap:6px;align-items:center}
.bars{display:flex;gap:2px;align-items:flex-end;height:11px}
.bars i{width:3px;background:currentColor;border-radius:1px}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}.bars i:nth-child(3){height:8.5px}.bars i:nth-child(4){height:11px}
.bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.bat::after{content:"";position:absolute;inset:1.5px;right:6px;background:currentColor;border-radius:1.5px}
.wifi{width:16px;height:12px}

/* Instagram */
.ig-top{display:flex;align-items:center;padding:4px 16px 8px;gap:18px}
.ig-logo{font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;font-size:28px;font-weight:700;margin-right:auto;letter-spacing:-.01em}
.ig-stories{display:flex;gap:14px;padding:4px 12px 12px;border-bottom:1px solid #EFEFEF;overflow:hidden;flex:none}
.ig-st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:#262626;flex:none;width:66px}
.ig-ring{width:66px;height:66px;border-radius:50%;padding:2.5px;background:conic-gradient(from 200deg,#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5,#FEDA75)}
.ig-ring i{display:block;width:100%;height:100%;border-radius:50%;border:2.5px solid #fff}
.ig-ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ig-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.ig-ph b{font-size:14px;display:block}
.ig-ph small{font-size:12px;color:#737373}
.ig-ph .dots{margin-left:auto;font-weight:700;letter-spacing:1px}
.ig-img{width:100%;aspect-ratio:1;position:relative;overflow:hidden}
.ig-img svg.art{position:absolute;inset:0;width:100%;height:100%}
.ig-ovl{position:absolute;left:0;right:0;bottom:0;padding:60px 18px 18px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.55));color:#fff;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.ig-cta{display:flex;justify-content:space-between;align-items:center;width:100%;height:46px;padding:0 14px;color:#fff;font-weight:600;font-size:15px}
.ig-cta svg.i{width:18px;height:18px}
.ig-acts{display:flex;gap:16px;padding:10px 14px 6px}
.ig-acts .bm{margin-left:auto}
.ig-cap{padding:0 14px 16px;font-size:14px;line-height:1.4}
.ig-likes{padding:0 14px 4px;font-size:14px;font-weight:600}
.ig-tab{flex:none;display:flex;justify-content:space-around;padding:10px 0 30px;border-top:1px solid #EFEFEF}

/* in-app browser + landing page (uses the client's brand colour --b) */
.br-top{flex:none;display:flex;align-items:center;gap:12px;padding:4px 16px 10px;border-bottom:1px solid #EFEFEF}
.br-top div{flex:1;text-align:center;line-height:1.2}
.br-top b{font-size:14px;display:block}
.br-top small{font-size:12px;color:#737373;display:inline-flex;align-items:center;gap:4px}
.br-top small svg.i{width:11px;height:11px;stroke-width:2.4}
.lp-hero{background:var(--b);color:var(--bt,#fff);padding:22px 20px 0}
.lp-logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px;letter-spacing:-.01em}
.lp-logo i{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-style:normal}
.lp-hero h1{margin:20px 0 10px;font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.025em}
.lp-hero p{font-size:16px;line-height:1.5;opacity:.88}
.lp-rate{margin-top:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.lp-rate .stars{color:#FFC94D;letter-spacing:1px}
.lp-art{margin-top:20px;height:190px;border-radius:16px 16px 0 0;overflow:hidden;position:relative}
.lp-art svg.art,.th svg.art{width:100%;height:100%;display:block}
.lp-proof{padding:20px 20px 8px;display:grid;gap:14px}
.lp-proof div{display:flex;gap:12px;align-items:center;font-size:15px;font-weight:500}
.lp-proof i{width:24px;height:24px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;flex:none}
.lp-proof i svg.i{width:13px;height:13px;stroke-width:3}
.lp-work{padding:16px 0 20px}
.lp-work h2{font-size:18px;font-weight:700;padding:0 20px 12px;letter-spacing:-.01em}
.lp-row{display:flex;gap:10px;padding:0 20px;overflow:hidden}
.th{flex:none;width:150px}
.th div{height:150px;border-radius:14px;overflow:hidden}
.th p{font-size:13px;color:#555;margin-top:6px}
.lp-sticky{flex:none;padding:12px 16px 30px;border-top:1px solid #EFEFEF;background:#fff}
.lp-btn{width:100%;height:52px;border-radius:14px;background:var(--b);color:var(--bt,#fff);font-weight:600;font-size:17px;text-align:center}

/* form */
.form{padding:20px 20px 24px}
.form h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.form > p{margin-top:6px;font-size:15px;color:#555}
.fld{margin-top:18px}
.fld label,.fld .lb{font-size:13px;font-weight:600;color:#475467;display:block}
.inp{height:48px;border:1px solid #D0D5DD;border-radius:12px;padding:0 14px;display:flex;align-items:center;font-size:16px;margin-top:6px;gap:8px}
.inp .cc{color:#667085;padding-right:8px;border-right:1px solid #E4E7EC}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{height:38px;padding:0 14px;border-radius:999px;border:1px solid #D0D5DD;font-size:14px;font-weight:500;color:#344054;text-align:center}
.opt.on{background:var(--b);border-color:var(--b);color:var(--bt,#fff)}
.chk{display:flex;gap:10px;align-items:center;margin-top:20px;font-size:15px}
.chk i{width:22px;height:22px;border-radius:6px;background:var(--b);color:#fff;display:grid;place-items:center}
.chk i svg.i{width:14px;height:14px;stroke-width:3}

/* thank-you */
.ty{padding:40px 24px 24px;text-align:center}
.ty-check{width:72px;height:72px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;margin:0 auto}
.ty-check svg.i{width:36px;height:36px;stroke-width:2.6}
.ty h1{margin-top:20px;font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.ty > p{margin-top:8px;font-size:16px;line-height:1.5;color:#555}
.ty-next{margin-top:28px;background:#F5F7FA;border-radius:16px;padding:18px;text-align:left;display:grid;gap:14px}
.ty-next h2{font-size:14px;font-weight:600;color:#667085}
.ty-next div{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:center;font-size:15px;line-height:1.35}
.ty-next b{width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid #E4E7EC;display:grid;place-items:center;font-size:13px}

/* iOS notification banner */
.nb{position:absolute;left:8px;right:8px;top:54px;z-index:20;background:rgba(246,246,248,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:22px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;box-shadow:0 12px 32px -8px rgba(0,0,0,.28);text-align:left;width:auto;color:#111}
.nb.drop{animation:drop .5s cubic-bezier(.2,.9,.3,1.1) .9s both}
@keyframes drop{from{transform:translateY(-140%);opacity:0}to{transform:none;opacity:1}}
.app-ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.app-ic svg.i{width:22px;height:22px}
.app-ic.wa{background:#25D366}
.app-ic.crm{background:var(--blue)}
.nb .tx{flex:1;min-width:0}
.nb .row{display:flex;justify-content:space-between;gap:8px}
.nb b{font-size:15px;font-weight:600}
.nb small{font-size:13px;color:#8A8A8E;white-space:nowrap}
.nb p{font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* WhatsApp */
.wa-head{flex:none;display:flex;align-items:center;gap:8px;padding:2px 12px 8px;background:#fff;border-bottom:1px solid #E9EDEF}
.wa-head > svg.i{color:#007AFF}
.wa-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.wa-name{flex:1;min-width:0;line-height:1.2}
.wa-name b{font-size:16px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-name small{font-size:12px;color:var(--wa-meta)}
.vbadge{width:15px;height:15px;flex:none}
.wa-head .acts{display:flex;gap:18px;color:#007AFF}
.wa-body{background:var(--wa-bg);padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px}
.wa-day{align-self:center;background:#fff;color:#54656F;font-size:12px;padding:4px 10px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);margin:4px 0}
.wa-note{align-self:center;max-width:88%;background:#FFEECD;color:#54656F;font-size:12px;line-height:1.35;text-align:center;padding:6px 10px;border-radius:8px}
.bub{max-width:84%;padding:7px 9px 5px 10px;border-radius:10px;font-size:15px;line-height:1.38;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.bub.in{align-self:flex-start;background:#fff;border-top-left-radius:3px}
.bub.out{align-self:flex-end;background:var(--wa-out);border-top-right-radius:3px}
.bub a{color:#027EB5}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--wa-meta);margin-top:2px}
.ticks{width:16px;height:11px}
.doc{display:flex;gap:10px;align-items:center;background:#F5F6F6;border-radius:8px;padding:9px;margin-bottom:2px}
.bub.out .doc{background:rgba(255,255,255,.55)}
.pdf{width:32px;height:38px;border-radius:5px;background:#fff;border:1px solid #E9EDEF;display:grid;place-items:center;font-size:9px;font-weight:700;color:#D92D20;flex:none}
.doc b{font-size:13.5px;font-weight:600;display:block;line-height:1.25}
.doc small{font-size:12px;color:var(--wa-meta)}
.wa-btns{align-self:flex-start;width:84%;display:grid;gap:3px;margin-top:-2px}
.wa-btns button,.wa-btns div{background:#fff;color:#027EB5;font-size:15px;font-weight:500;text-align:center;padding:10px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);display:flex;align-items:center;justify-content:center;gap:6px}
.wa-btns svg.i{width:16px;height:16px}
.wa-btns .used{color:#8696A0}
.flow-r{font-size:12.5px;color:#54656F;display:flex;gap:6px;align-items:center;margin-bottom:4px}
.flow-r svg.i{width:14px;height:14px;color:var(--wa)}
.wa-input{flex:none;display:flex;gap:10px;align-items:center;padding:8px 12px 30px;background:#F6F6F6;color:#007AFF}
.wa-input div{flex:1;height:36px;border-radius:18px;background:#fff;border:1px solid #E4E4E4}
.wa-input svg.i{width:24px;height:24px}

/* bottom sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.38);z-index:4}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#fff;border-radius:16px 16px 0 0;display:flex;flex-direction:column;max-height:88%;animation:up .32s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
.sheet-h{flex:none;display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid #E9EDEF}
.sheet-h b{flex:1;text-align:center;font-size:17px;font-weight:600}
.sheet-h span{width:24px}
.sheet-body{flex:1;overflow-y:auto;padding:4px 16px 12px;scrollbar-width:none}
.sheet .lbl{font-size:14px;font-weight:600;color:#54656F;margin:18px 0 8px}
.radio{display:flex;align-items:center;gap:12px;height:50px;padding:0 14px;border:1px solid #E9EDEF;border-radius:12px;font-size:15px;width:100%;margin-bottom:8px}
.radio i{width:20px;height:20px;border-radius:50%;border:2px solid #AEBAC1;flex:none}
.radio.on{border-color:var(--wa)}
.radio.on i{border:6px solid var(--wa)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{border:1px solid #E9EDEF;border-radius:12px;padding:8px 0;text-align:center;line-height:1.2}
.day small{display:block;font-size:12px;color:#667781}
.day b{display:block;font-size:20px;font-weight:700;margin:2px 0}
.day.on{background:var(--wa);border-color:var(--wa);color:#fff}
.day.on small{color:#E6FFF6}
.day:disabled{opacity:.45;cursor:default}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tm{height:44px;border:1px solid #E9EDEF;border-radius:10px;font-size:14px;font-weight:500;text-align:center}
.tm.on{background:var(--wa);border-color:var(--wa);color:#fff}
.tm:disabled{color:#AEBAC1;text-decoration:line-through;cursor:default}
.sheet-f{flex:none;padding:10px 16px 30px;border-top:1px solid #E9EDEF}
.sheet-f small{display:block;text-align:center;font-size:12px;color:#667781;margin-bottom:10px}
.sheet-btn{width:100%;height:50px;border-radius:25px;background:var(--wa);color:#fff;font-weight:600;font-size:16px;text-align:center}
.sheet-btn.crm{background:var(--blue);border-radius:14px}

/* lock screens */
.ls{color:#fff;text-align:center}
.ls .sb{color:#fff}
.ls-date{margin-top:34px;font-size:20px;font-weight:600;opacity:.92}
.ls-time{font-size:92px;line-height:1;font-weight:700;letter-spacing:-3px;font-variant-numeric:tabular-nums;margin-top:2px}
.ls-focus{margin:10px auto 0;display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:999px}
.ls-focus svg.i{width:14px;height:14px}
.ls-notifs{margin-top:auto;padding:0 8px 18px;display:grid;gap:8px;text-align:left}
.ls-notifs .nb{position:static;background:rgba(250,250,252,.82)}
.ls-group{font-size:13px;font-weight:600;color:rgba(255,255,255,.85);padding:0 8px}
.ls-bottom{flex:none;display:flex;justify-content:space-between;padding:6px 44px 44px}
.ls-bottom span{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center}
.ls-bottom svg.i{width:22px;height:22px}

/* CRM app (owner) */
.crm{background:#F5F7FA}
.crm-bar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:2px 16px 8px;color:var(--blue);font-size:16px;font-weight:500;background:#fff}
.crm-bar span{display:flex;align-items:center;gap:2px}
.crm-tab{flex:none;display:flex;justify-content:space-around;padding:8px 0 28px;background:#fff;border-top:1px solid var(--line)}
.crm-tab button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#98A2B3;width:72px}
.crm-tab button.on{color:var(--blue)}
.ld{background:#fff;padding:6px 20px 20px;text-align:center}
.ld-av{width:64px;height:64px;border-radius:50%;background:var(--blue-50);color:var(--blue-ink);display:grid;place-items:center;font-size:22px;font-weight:700;margin:0 auto}
.ld h1{margin-top:10px;font-size:24px;font-weight:700;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;margin-top:8px;background:#FFFAEB;color:#B54708}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.won{background:var(--green-50);color:var(--green-ink)}
.ld-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.ld-acts button{height:62px;border-radius:14px;background:#F5F7FA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--blue)}
.ld-acts svg.i{width:20px;height:20px}
.card{background:#fff;margin:12px 12px 0;border-radius:16px;padding:4px 16px}
.card h2{font-size:15px;font-weight:700;padding:14px 0 6px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid #F0F2F5;font-size:15px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-3)}
.kv b{font-weight:600;text-align:right}
.tl{list-style:none;padding:4px 0 12px}
.tl li{display:grid;grid-template-columns:88px 14px 1fr;gap:10px;font-size:14px;line-height:1.35;padding:7px 0;position:relative}
.tl time{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--green);margin-top:4px;position:relative}
.tl li:not(:last-child) .dot::after{content:"";position:absolute;left:4px;top:12px;width:2px;height:32px;background:#E4E7EC}
.auto{display:inline-block;font-size:11px;font-weight:700;color:var(--green-ink);background:var(--green-50);border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.pg-h{background:#fff;padding:4px 16px 12px}
.pg-h h1{font-size:30px;font-weight:700;letter-spacing:-.025em}
.pg-h p{font-size:14px;color:var(--ink-3);margin-top:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;background:#fff;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.tabs button i{width:7px;height:7px;border-radius:50%}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.list{padding:12px;display:grid;gap:8px}
.lc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lc .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lc b{font-size:15px;font-weight:650}
.lc time,.lc .v{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.lc .v{color:var(--green-ink);font-weight:700}
.lc .ph{font-size:13px;color:var(--ink-3);margin-top:2px}
.lc .tag{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--blue-ink);background:var(--blue-50);border-radius:6px;padding:3px 8px}
.lc.hl{border-color:#A4BCFD;background:#F5F8FF;box-shadow:0 0 0 3px #E0E8FF}
.lc .moved{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--green-ink);font-weight:600}
.lc .moved svg.i{width:14px;height:14px}
.td-h{background:#fff;padding:6px 20px 16px}
.td-h p{font-size:14px;color:var(--ink-3)}
.td-h h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.night{margin:12px 12px 0;border-radius:18px;background:var(--ink);color:#fff;padding:16px 16px 14px}
.night p{font-size:13px;color:#94A3B8;font-weight:600}
.night h2{font-size:18px;line-height:1.3;margin-top:4px;letter-spacing:-.01em}
.night .st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.night .st div{background:#1E293B;border-radius:12px;padding:10px}
.night .st b{display:block;font-size:20px}
.night .st small{font-size:11.5px;color:#94A3B8}
.ap{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid #F0F2F5;font-size:14.5px}
.ap:last-child{border-bottom:0}
.ap time{font-weight:700;font-variant-numeric:tabular-nums}
.ap small{display:block;color:var(--ink-3);font-size:13px}
.fu{padding:6px 0 14px}
.fu .t{display:flex;justify-content:space-between;align-items:baseline}
.fu b{font-size:15px}
.fu .warn{font-size:12.5px;font-weight:600;color:#B54708}
.fu .ph{font-size:13px;color:var(--ink-3);margin-top:2px}
.fu blockquote{margin-top:10px;background:#F5F7FA;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.fu-btn{margin-top:10px;width:100%;height:44px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.fu-btn.sent{background:var(--green-50);color:var(--green-ink)}
.fu-btn svg.i{width:18px;height:18px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:10;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center;animation:up .3s both}
.toast svg.i{width:18px;height:18px;color:#6CE9A6}
.stg{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;width:100%;margin-bottom:8px}
.stg i.d{width:9px;height:9px;border-radius:50%}
.stg .r{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid #D0D5DD}
.stg small{color:var(--ink-3);font-size:12.5px}
.stg.on{border-color:var(--blue);background:#F5F8FF}
.stg.on .r{border:6px solid var(--blue)}
.val{height:52px;border:1px solid var(--line-2);border-radius:12px;padding:0 14px;display:flex;align-items:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sheet .note{font-size:13px;color:var(--ink-3);margin-top:8px}
.won-s{background:linear-gradient(180deg,#ECFDF3 0%,#FFFFFF 46%)}
.won-top{text-align:center;padding:30px 24px 8px}
.won-top .ok{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 12px 30px -8px rgba(5,150,105,.5)}
.won-top .ok svg.i{width:42px;height:42px;stroke-width:2.6}
.won-top p{margin-top:18px;font-size:16px;font-weight:600;color:var(--green-ink)}
.won-top h1{font-size:46px;font-weight:700;letter-spacing:-.035em;margin-top:2px;font-variant-numeric:tabular-nums}
.won-top small{display:block;font-size:15px;color:var(--ink-2);margin-top:4px}
.path{margin:20px 16px 0;border:1px solid var(--line);border-radius:16px;padding:6px 16px 8px;background:#fff}
.path h2{font-size:15px;font-weight:700;padding:12px 0 4px}
.path .tl li{grid-template-columns:96px 14px 1fr}
.rp-h{background:#fff;padding:4px 20px 14px}
.rp-h p{font-size:13px;color:var(--ink-3)}
.rp-h h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 12px 0}
.kpi{background:#fff;border-radius:14px;padding:12px 14px}
.kpi span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--green-ink);font-weight:600}
.rev{margin:8px 12px 0;background:var(--ink);color:#fff;border-radius:16px;padding:16px}
.rev span{font-size:13px;color:#94A3B8;font-weight:600}
.rev b{display:block;font-size:34px;letter-spacing:-.03em;margin-top:2px}
.rev small{font-size:13px;color:#CBD5E1}
.chart{display:flex;align-items:flex-end;gap:14px;height:96px;padding:8px 4px 0}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);height:100%;justify-content:flex-end}
.chart i{width:100%;border-radius:6px 6px 2px 2px;background:var(--blue)}
.chart div:last-child i{background:var(--blue-ink)}
.src{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;padding:6px 0 14px}
.src .bar{grid-column:1/-1;height:8px;border-radius:4px;background:#EEF2FF;overflow:hidden;margin-bottom:6px}
.src .bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.zero{display:flex;gap:10px;align-items:center;margin:8px 12px 0;background:var(--green-50);color:var(--green-ink);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600}
.zero svg.i{width:20px;height:20px}
.restart{margin:14px 12px 16px;height:48px;border-radius:14px;border:1px solid var(--line-2);background:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px)}
.restart svg.i{width:18px;height:18px}

/* ============ Responsive ============ */
@media (max-width:1179px){
  .app{grid-template-columns:auto minmax(280px,400px);grid-template-areas:"phone panel" "phone rail";gap:24px 32px;padding:16px 20px 40px}
  .top{padding:20px 20px 8px}
  .rail{padding:0 4px}
  .panel{position:static}
}
@media (max-width:719px){
  .top{padding:14px 14px 6px;gap:10px}
  .brand small{display:none}
  .seg{width:100%;overflow-x:auto;scrollbar-width:none}
  .seg button{flex:1;padding:0 8px;font-size:14px;height:36px}
  .app{grid-template-columns:1fr;grid-template-areas:"mnav" "phone" "panel";padding:8px 12px 32px;gap:12px}
  .rail{display:none}
  .phone-wrap{width:100%;height:auto}
  .phone{position:relative;width:100%;height:auto;padding:0;background:none;box-shadow:none;border-radius:0;transform:none}
  .phone::after,.island{display:none}
  .screen{width:100%;height:min(812px,calc(100svh - 170px));min-height:560px;border-radius:24px;border:1px solid var(--line)}
  .panel{position:static;padding:20px}
  .panel h1{font-size:24px}
  .pnav{display:none}
  .mnav{grid-area:mnav;display:flex;align-items:center;gap:8px}
  .mnav .lbl{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.25}
  .mnav .lbl small{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
  .mnav .lbl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mnav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center;flex:none}
  .mnav button.go{background:var(--blue);border-color:var(--blue);color:#fff}
  .mnav button:disabled{opacity:.4}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hint{box-shadow:0 0 0 3px rgba(36,83,255,.55)}
}
</style>
</head>

<header class="top">
  <div class="brand"><span class="mark">P</span>Pushkar Design Solution<small>Lead Growth System prototype</small></div>
  <div class="seg" role="group" aria-label="Business type" id="seg">
    <button data-p="interior" aria-pressed="true">Interior designer</button>
    <button data-p="detailing" aria-pressed="false">Car detailing</button>
    <button data-p="clinic" aria-pressed="false">Skin clinic</button>
  </div>
</header>

   ========================================================= */
let hintT, autoT;
function render(){
  const p = P[pk], s = STEPS[step];
  clearTimeout(hintT); clearTimeout(autoT);

  // screen
  const scr = document.createElement("div");
  scr.className = `scr ${s.dark ? "dark" : ""} ${dir > 0 ? "fwd" : dir < 0 ? "back" : ""} ${s.tapAll ? "tapall" : ""}`;
  scr.style.setProperty("--b", p.b);
  scr.innerHTML = s.scr(p);
  if(s.tapAll) scr.addEventListener("click", () => next());
  const box = $("screen");
  const keep = dir === 0 ? [...box.querySelectorAll(".scroll,.sheet-body")].map(e => e.scrollTop) : [];
  if(dir === 0) scr.classList.add("still");
  box.innerHTML = ""; box.appendChild(scr);
  scr.querySelectorAll(".scroll,.sheet-body").forEach((e,i) => { if(keep[i] != null) e.scrollTop = keep[i]; });
  const bottom = scr.querySelector("[data-bottom]"); if(bottom) bottom.scrollTop = bottom.scrollHeight;
  const tabOn = scr.querySelector('.tabs [aria-pressed="true"]'); if(tabOn) tabOn.parentNode.scrollLeft = tabOn.offsetLeft - 16;

  // wire up taps inside the phone
  scr.querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); next(); }));
  scr.querySelectorAll("[data-opt]").forEach(b => b.onclick = e => { e.stopPropagation(); S[b.dataset.opt] = +b.dataset.i; refresh(); });
  scr.querySelectorAll("[data-mode]").forEach(b => b.onclick = e => { e.stopPropagation(); S.mode = +b.dataset.mode; refresh(); });
  scr.querySelectorAll("[data-day]").forEach(b => b.onclick = e => { e.stopPropagation(); S.day = +b.dataset.day; refresh(); });
  scr.querySelectorAll("[data-time]").forEach(b => b.onclick = e => { e.stopPropagation(); S.time = +b.dataset.time; refresh(); });
  scr.querySelectorAll("[data-pipe]").forEach(b => b.onclick = e => { e.stopPropagation(); S.pipe = +b.dataset.pipe; refresh(); });
  const fu = scr.querySelector('[data-act="followup"]');
  if(fu) fu.onclick = e => { e.stopPropagation(); if(S.sent){ next(); return; } S.sent = true; S.justSent = true; refresh(); autoT = setTimeout(next, 1400); };
  const rs = scr.querySelector('[data-act="restart"]');
  if(rs) rs.onclick = e => { e.stopPropagation(); Object.assign(S,{day:1,time:1,mode:0,f1:null,f2:null,f3:null,pipe:2,sent:false}); go(0); };

  // hint ring on the next tap target
  const target = s.tapAll ? null : (scr.querySelector('[data-act="followup"]:not(.sent)') || scr.querySelector("[data-go]") || scr.querySelector('[data-act="restart"]'));
  hintT = setTimeout(() => target && target.classList.add("hint"), 1500);

  // panel
  const when = typeof s.when === "function" ? s.when(p) : s.when;
  const isC = s.who === "c";
  $("who").className = "who" + (isC ? "" : " owner");
  $("who").innerHTML = I(isC ? "user" : "kanban") + (isC ? `On ${first(p.cust)}'s phone` : `On ${p.owner}'s phone`);
  $("when").textContent = when;
  $("ptitle").textContent = s.title;
  $("pdesc").textContent = s.desc(p);
  $("pbts").innerHTML = s.bts(p).map(t => `<li><i>${I("check")}</i>${t}</li>`).join("");
  $("prev").disabled = step === 0; $("mprev").disabled = step === 0;
  $("next").innerHTML = step === STEPS.length - 1 ? `Start again${I("replay")}` : `Next${I("right")}`;
  $("mlbl").innerHTML = `<small>${isC ? "Customer" : "Owner"}, step ${step+1} of ${STEPS.length}</small><span>${s.title}</span>`;
  document.querySelector(".tip").textContent = s.tapAll ? "Tap anywhere on the phone to continue, or use the arrow keys." : "Tap the highlighted spot on the phone, or use the arrow keys.";

  renderRail();
  try{ history.replaceState(null, "", `#${pk}-${step+1}`); }catch(e){}
}
function refresh(){ dir = 0; render(); }
function renderRail(){
  const p = P[pk];
  const item = (s,i) => `<li><button class="${i<step?"done":""} ${i===step?"now":""}" data-step="${i}" ${i===step?'aria-current="step"':""}>
    <span class="n">${i<step ? I("check") : i+1}</span>${s.title}</button></li>`;
  $("rail").innerHTML =
    `<h2>${I("user")}${first(p.cust)}, the customer</h2><ol>${STEPS.map((s,i) => s.who==="c" ? item(s,i) : "").join("")}</ol>
     <h2>${I("kanban")}${p.owner}, the owner</h2><ol>${STEPS.map((s,i) => s.who==="o" ? item(s,i) : "").join("")}</ol>`;
  $("rail").querySelectorAll("[data-step]").forEach(b => b.onclick = () => go(+b.dataset.step));
}
function go(i){ i = Math.max(0, Math.min(STEPS.length-1, i)); dir = i >= step ? 1 : -1; step = i; S.justSent = false; render(); }
function next(){ if(step === STEPS.length - 1){ Object.assign(S,{sent:false}); go(0); } else go(step+1); }
function prev(){ go(step-1); }

$("next").onclick = next; $("prev").onclick = prev;
$("mnext").onclick = next; $("mprev").onclick = prev;
document.addEventListener("keydown", e => {
  if(e.key === "ArrowRight"){ e.preventDefault(); next(); }
  if(e.key === "ArrowLeft"){ e.preventDefault(); prev(); }
});
document.querySelectorAll("#seg button").forEach(b => b.onclick = () => {
  pk = b.dataset.p; S.f1 = S.f2 = S.f3 = null; S.sent = false;
  document.querySelectorAll("#seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  dir = 0; render();
});

/* scale the phone to fit shorter screens */
function fit(){
  if(innerWidth < 720){ document.documentElement.style.setProperty("--k", 1); return; }
  const top = document.querySelector(".top").offsetHeight;
  let k = Math.min(1, (innerHeight - top - 48) / 836);
  if(innerWidth < 1180) k = Math.min(k, (innerWidth - 40 - 32 - 280) / 399);
  k = Math.max(.62, k);
  document.documentElement.style.setProperty("--k", k.toFixed(3));
}
addEventListener("resize", fit);

/* deep links: #interior-5, #detailing-12, #clinic-1 */
(function init(){
  const m = location.hash.match(/^#(interior|detailing|clinic)-(\d+)$/);
  if(m){ pk = m[1]; step = Math.max(0, Math.min(STEPS.length-1, +m[2]-1)); }
  document.querySelectorAll("#seg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.p === pk));
  fit(); dir = 0; render();
})();
</script>
